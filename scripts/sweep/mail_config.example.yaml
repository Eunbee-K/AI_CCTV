# 메일 발송 설정 예시.
#
# 이 파일을 scripts/sweep/mail_config.yaml 로 복사해서 실제 값을 채워 넣을 것.
# mail_config.yaml (실제 비밀번호가 들어간 파일)은 .gitignore에 등록되어 있어
# git에는 올라가지 않는다.
#
# sender_app_password는 Gmail 로그인 비밀번호가 아니라 "앱 비밀번호"를 써야 한다.
#   Google 계정 -> 보안 -> 2단계 인증(먼저 켜져 있어야 함) -> 앱 비밀번호 에서 발급.

smtp_host: smtp.gmail.com
smtp_port: 465
sender_email: "your_gmail@gmail.com"
sender_app_password: "xxxx xxxx xxxx xxxx"
recipient_email: "recipient@example.com"

# 인터넷 연결 확인 주기(초). mailer.py --interval 로 실행 시 넘기면 그 값이 우선.
# 모든 run이 끝나기 전까지는 이 주기와 무관하게 대기만 하고, 끝난 뒤부터 이 주기로 확인함.
check_interval_sec: 10800
