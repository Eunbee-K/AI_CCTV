# test3_18class_20h_260729 — 2026-07-29 실행한 bbox 18클래스 파이프라인 검증용
# 스윕. test3_18class.yaml(본학습, 클래스당 최대 12000장)과 같은 18개 클래스·
# 같은 소스를 쓰되, 데이터가 풍부한 10개 클래스(BK/CC/CL/DS/JD/JF/LP/SD/PJ/IN)만
# 3900/488/488로 줄였다(6000/750/750의 65% — 같은 날 이어서 돌리는
# test4_seg_20h_260729.yaml과 합쳐서 20시간 예산에 맞추려고 둘 다 65%로 축소).
# 데이터가 원래 부족해서 상한이 낮은 8개 클래스(CM/HL/JS/LS/PO/RT/SG/TO)는
# test3_18class.yaml과 동일(이미 가용량 근처라 더 줄일 이유가 없음).
#
# 산정 근거: 2026-07-29 기준 이미 GPU에서 돌고 있던 legacy 5클래스 학습
# (test3_yolo11L_class5_16000, batch=4, imgsz=960, train 80,000장)의 실측
# 에폭당 시간이 1424초(23.7분)로 매우 일정했음 -> 56.2 img/s.
# train 52,992장 x 50epoch / 56.2 img/s ≈ 47,143초 ≈ 13.1시간
# (+ test4_seg_20h_260729.yaml 약 7.1시간 = 합계 약 20.2시간, 둘 다 보수적으로
# 잡은 값이라 실제는 이보다 빠를 가능성이 높음. run_sweep.py에 두 config를
# 같이 줘서 이어서 실행).

sweep_name: test3_18class_20h_260729_sweep01

